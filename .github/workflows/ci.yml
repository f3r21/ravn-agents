name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # dist/ is committed because the plugin cache runs no build step, so it must match src/.
      - name: Rebuild dist and check it is committed
        run: |
          npm run build --workspaces --if-present
          git diff --exit-code -- 'packages/*/dist' || {
            echo "::error::dist/ is stale. Run 'npm run build -w packages/<tool>' and commit the result."
            exit 1
          }

      - run: npm run typecheck

      - run: npm test

      - name: Validate plugin manifest
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
